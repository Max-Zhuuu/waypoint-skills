name: Lint Skills

on:
  pull_request:
    paths:
      - 'task/**/SKILL.md'
      - 'project/**/SKILL.md'
      - 'in-progress/**/SKILL.md'
      - 'third-party/**/SKILL.md'

jobs:
  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SKILL.md line budget and Writes/manifest convention
        run: bash lint-skills.sh
